# Factorio headless server — single stack on the published multi-arch GHCR image.
# First run:  ./setup.sh   (seeds ./config/*.json and the data directories)
# Then:       docker compose up -d
#
# Tune server parameters two ways (env overrides win, applied at boot WITHOUT
# modifying the committed JSON):
#   1. Edit config/server-settings.json directly, or
#   2. Set variables in the `environment:` block below.
#
# SECRETS (TOKEN, passwords): do NOT put real values in this file — it's tracked
# in git. Instead create a git-ignored docker-compose.override.yml (Compose merges
# it automatically) with just the secret env, e.g.:
#     services: { factorio: { environment: { USERNAME: "you", TOKEN: "abc123" } } }
# ...or put username/token straight into config/server-settings.json (host-only).

services:
  factorio:
    container_name: factorio
    # Pinned to an explicit version so an unattended pull can't jump Factorio
    # versions and break saves/mods. Bump this deliberately (see ./publish.sh).
    image: ghcr.io/williamweatherholtz/factorio:2.0.77
    restart: unless-stopped

    # On SIGTERM Factorio saves the map and quits cleanly (verified ~2s); the
    # grace period is headroom for very large maps before Docker SIGKILLs.
    # (Do NOT use SIGINT — runuser, this image's PID 1, does not forward it,
    # so the container would hang the full grace period then be killed unsaved.)
    stop_signal: SIGTERM
    stop_grace_period: 120s

    ports:
      - "34197:34197/udp"        # game — must be reachable by players
      - "27015:27015/tcp"        # RCON — on all interfaces by choice; guard via firewall

    # All configuration is set directly here (no env_file). Uncomment and edit
    # any knob to override config/server-settings.json AT BOOT. Blank values are
    # ignored; mistyped values (bad number/bool/enum) abort the boot with a clear
    # error. See the SECRETS note in the header before putting a real TOKEN here.
    environment:
      DLC_SPACE_AGE: "true"                 # Space Age DLC; "false" to disable

      # --- LAN preset (default): private, LAN-discoverable, no auth check ---
      # Works on an offline LAN with no account linking. To go public: set
      # PUBLIC "true", REQUIRE_USER_VERIFICATION "true", and provide USERNAME/TOKEN.
      SERVER_VISIBILITY_PUBLIC: "false"
      SERVER_VISIBILITY_LAN: "true"
      REQUIRE_USER_VERIFICATION: "false"

      # --- server tuning (override config/server-settings.json) ---
      #SERVER_NAME: "My Factorio Server"
      #SERVER_DESCRIPTION: "Hosted with Docker"
      #MAX_PLAYERS: "0"                     # 0 = unlimited
      #AUTO_PAUSE: "true"
      #AFK_AUTOKICK_INTERVAL: "0"           # minutes; 0 = never
      #ALLOW_COMMANDS: "admins-only"        # true | false | admins-only
      #AUTOSAVE_INTERVAL: "10"              # minutes

      # --- account linking (factorio.com/profile) — SEE SECRETS NOTE ABOVE ---
      # Enables public server-browser listing AND mod auto-download. Prefer a
      # git-ignored docker-compose.override.yml for these rather than committing.
      #USERNAME: "FactorioUsername"
      #TOKEN: "your-token-here"

      # --- orchestration (read by the entrypoint, not part of server-settings) ---
      #UPDATE_MODS_ON_START: "true"         # needs USERNAME/TOKEN
      #DEBUG: "false"                       # verbose boot diagnostics
      #PUID: "845"
      #PGID: "845"

    volumes:
      - ./config:/factorio/config          # server-settings, map-*, rconpw, lists, server-id
      - ./saves:/factorio/saves            # back these up
      - ./mods:/factorio/mods              # add/remove mods from the host
      - ./scenarios:/factorio/scenarios
      - ./script-output:/factorio/script-output

    # Detect a hung/unresponsive server (process alive but not serving) via an
    # RCON ping. The bundled /bin/rcon reads RCON_PORT + the generated password
    # from the container env, so no args/secrets are needed here.
    healthcheck:
      test: ["CMD-SHELL", "rcon /players >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s                   # first boot may generate a map

    # Cap log growth so a chatty server can't fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Optional resource caps — Factorio RAM scales with map size; size to taste.
    #mem_limit: 4g
    #mem_reservation: 1g
    #cpus: "2.0"
