# Factorio headless server — runs the published multi-arch image from GHCR.
# First run:  ./setup.sh   (seeds ./config/*.json, data dirs, and .env)
# Then:       docker compose up -d
#
# This is the single compose file for the project. Server parameters can be
# tuned three ways, in increasing precedence:
#   1. Edit config/server-settings.json directly (full fidelity), or
#   2. Uncomment the tuning knobs in the `environment:` block below, or
#   3. Put them in .env (git-ignored; good for secrets like TOKEN).
# Env values override the JSON at boot without ever modifying the committed file.

services:
  factorio:
    container_name: factorio
    # Pinned to an explicit version so an unattended pull can't jump Factorio
    # versions and break saves/mods. Bump this deliberately (see ./publish.sh).
    image: ghcr.io/williamweatherholtz/factorio:2.0.77
    restart: unless-stopped

    # On SIGTERM Factorio saves the map and quits cleanly (verified ~2s); the
    # grace period is headroom for very large maps before Docker SIGKILLs.
    # (Do NOT use SIGINT here — runuser, this image's PID 1, does not forward it,
    # so the container would hang the full grace period then be killed unsaved.)
    stop_signal: SIGTERM
    stop_grace_period: 120s

    ports:
      - "34197:34197/udp"        # game — must be reachable by players
      - "27015:27015/tcp"        # RCON — on all interfaces by choice; guard via firewall

    # Optional secrets/advanced vars; safe to omit (a fresh clone can `up` before
    # ./setup.sh creates .env). Values here are overridden by `environment:` below.
    env_file:
      - path: .env
        required: false

    # --- Server tuning knobs -------------------------------------------------
    # Uncomment any of these to override config/server-settings.json AT BOOT.
    # The committed JSON file is never modified. Blank values are ignored;
    # mistyped values (bad number/bool/enum) abort the boot with a clear error.
    environment:
      # Space Age DLC is on by default; set "false" to disable. (Active so this
      # block is a valid mapping — everything below is a commented example.)
      DLC_SPACE_AGE: "true"
      #SERVER_NAME: "My Factorio Server"
      #SERVER_DESCRIPTION: "Hosted with Docker"
      #MAX_PLAYERS: "0"                    # 0 = unlimited
      #SERVER_VISIBILITY_PUBLIC: "false"   # list in the public server browser
      #SERVER_VISIBILITY_LAN: "true"
      #REQUIRE_USER_VERIFICATION: "true"
      #AUTO_PAUSE: "true"
      #AFK_AUTOKICK_INTERVAL: "0"          # minutes; 0 = never
      #ALLOW_COMMANDS: "admins-only"       # true | false | admins-only
      #AUTOSAVE_INTERVAL: "10"             # minutes
      # --- account linking (factorio.com/profile) ---
      # Enables public server-browser listing AND mod auto-download. Written into
      # the rendered server-settings at boot; never persisted to the committed JSON.
      #USERNAME: ""
      #TOKEN: ""
      # --- orchestration (read by the entrypoint, not part of server-settings) ---
      #UPDATE_MODS_ON_START: "true"        # needs USERNAME/TOKEN above
      #DEBUG: "false"                      # verbose boot diagnostics
      #PUID: "845"
      #PGID: "845"

    volumes:
      - ./config:/factorio/config          # server-settings, map-*, rconpw, lists, server-id
      - ./saves:/factorio/saves            # back these up
      - ./mods:/factorio/mods              # add/remove mods from the host
      - ./scenarios:/factorio/scenarios
      - ./script-output:/factorio/script-output

    # Detect a hung/unresponsive server (process alive but not serving) via an
    # RCON ping. The bundled /bin/rcon reads RCON_PORT + the generated password
    # from the container env, so no args/secrets are needed here.
    healthcheck:
      test: ["CMD-SHELL", "rcon /players >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s                   # first boot may generate a map

    # Cap log growth so a chatty server can't fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Optional resource caps — Factorio RAM scales with map size; size to taste.
    #mem_limit: 4g
    #mem_reservation: 1g
    #cpus: "2.0"
